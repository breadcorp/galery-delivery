name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: fileinfo, openssl, zip, gd, mbstring

      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run smoke and v5 regression tests
        run: |
          php tests/run.php
          php tests/v5.php
